name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor packages
        run: npm ci

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME is set), so
      # we use its sdkmanager directly instead of android-actions/setup-android,
      # which is broken on current runner images (it fails on `sdkmanager tools`).
      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed | grep -E "platforms;android-36|build-tools;36" || true

      # Optional: if the keystore secrets are configured, sign with the real
      # release key; otherwise the build falls back to the debug key.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android-release.jks
            cat > keystore.properties <<EOF
          storeFile=android-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Release keystore restored; APK will be signed with the release key."
          else
            echo "No keystore secrets found; APK will be signed with the debug key."
          fi

      - name: Build release APK
        working-directory: .
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: azan-scheduler-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          gh release create "$TAG" "$APK" \
            --title "$TAG" \
            --notes "نسخه $TAG اپلیکیشن اوقات شرعی اذان — فایل APK را دانلود و روی گوشی نصب کنید." \
            || gh release upload "$TAG" "$APK" --clobber
